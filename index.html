<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOMO TEK Leipzig – Produktionszeit-Rechner</title>
<meta name="theme-color" content="#262626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Produktionszeit">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--bg:#f0f0f0;--card:#fff;--tx:#262626;--mut:#6a6a6a;--ac:#1c69d4;--acd:#0653b6;--bd:#cfcfcf;--hd:#262626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mut:#a0a0a0;--ac:#4a90e8;--acd:#1c69d4;--bd:#3a3a3a;--hd:#000}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mut:#a0a0a0;--ac:#4a90e8;--acd:#1c69d4;--bd:#3a3a3a;--hd:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"BMW Group Type","Helvetica Neue",Helvetica,Arial,sans-serif;padding:0 0 24px}
header{background:var(--hd);color:#fff;padding:20px 16px 16px;border-bottom:3px solid var(--ac)}
header>div{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo{height:56px;width:auto;flex:none}
header section{min-width:0}
h1{font-size:16px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 6px;color:#9fc3f4}
header p{margin:0;font-size:22px;font-weight:300;letter-spacing:.01em}
main{max-width:480px;margin:16px auto 0;padding:0 16px}
.card{background:var(--card);padding:20px 16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
input,select{width:100%;font:inherit;font-size:20px;font-weight:300;padding:10px 0;border:0;border-bottom:1px solid var(--tx);background:transparent;color:var(--tx);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx) 50%),linear-gradient(135deg,var(--tx) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:24px}
input:focus,select:focus{outline:0;border-bottom:2px solid var(--ac)}
.r{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}
.r span{color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.r b{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
.big{padding:16px 0}
.big b{font-size:38px;color:var(--ac);font-weight:300}
.note{font-size:12px;color:var(--mut);margin-top:8px}
button{width:100%;margin-top:16px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px;background:var(--ac);color:#fff;border:0;cursor:pointer}
button:hover{background:var(--acd)}
summary{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-size:20px;line-height:1;color:var(--ac)}
details[open] summary::after{content:"–"}

/* iOS optimization layer */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  min-height:100%;
  background:var(--bg);
  overscroll-behavior-y:none;
}
body{
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  padding:
    max(0px, env(safe-area-inset-top))
    0
    max(24px, env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
header{
  padding-top:max(20px, calc(20px + env(safe-area-inset-top)));
}
main{
  width:100%;
  max-width:560px;
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
}
.card{
  -webkit-tap-highlight-color:transparent;
}
input,select,textarea,button{
  touch-action:manipulation;
}
input,select,textarea{
  -webkit-user-select:text;
  user-select:text;
}
button,summary,select{
  -webkit-tap-highlight-color:transparent;
}
button{
  min-height:48px;
  border-radius:10px;
  -webkit-appearance:none;
  appearance:none;
}
.row button{
  min-height:44px;
  border-radius:8px;
}
input,select{
  min-height:44px;
}
select{
  font-size:18px;
}
textarea{
  border-radius:10px;
  -webkit-appearance:none;
  appearance:none;
  resize:vertical;
}
summary{
  min-height:44px;
  align-items:center;
}
@media (max-width:380px){
  .g{grid-template-columns:1fr;gap:14px}
  header>div{gap:12px}
  .logo{height:48px}
  header p{font-size:19px}
  .big b{font-size:32px}
}
@media (min-width:600px){
  body{padding-bottom:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important}
}



.preset-btn{width:100%;min-height:48px;padding:12px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.preset-btn:active{transform:scale(.98)}
.preset-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.takt-presets {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 14px !important;
  margin: 18px 0 22px !important;
  width: 100% !important;
}
.takt-presets .preset-btn {
  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;
  width: 100% !important;
  min-height: 78px !important;
  padding: 14px 8px !important;
  background: #2b2b2b !important;
  color: #ffffff !important;
  border: 2px solid #666666 !important;
  border-radius: 14px !important;
  font-size: 19px !important;
  font-weight: 700 !important;
  line-height: 1.25 !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  cursor: pointer !important;
  touch-action: manipulation !important;
  -webkit-tap-highlight-color: rgba(25,118,210,.35) !important;
}
.takt-presets .preset-btn span {
  font-size: 15px !important;
  font-weight: 500 !important;
  opacity: .8 !important;
}
.takt-presets .preset-btn.active {
  background: #1976d2 !important;
  border-color: #1976d2 !important;
  color: #ffffff !important;
}


.takt-presets {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 12px !important;
  width: calc(100% - 60px) !important;
  margin: 0 30px 18px !important;
}
.takt-presets .preset-btn {
  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;
  box-sizing: border-box !important;
  min-height: 82px !important;
  width: 100% !important;
  padding: 12px !important;
  border: 2px solid #777 !important;
  border-radius: 14px !important;
  background: #292929 !important;
  color: #fff !important;
  font-size: 19px !important;
  font-weight: 700 !important;
  line-height: 1.25 !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  touch-action: manipulation !important;
}
.takt-presets .preset-btn small {
  font-size: 14px !important;
  font-weight: 400 !important;
  color: #bbb !important;
}
.takt-presets .preset-btn.active {
  background: #1976d2 !important;
  border-color: #1976d2 !important;
}
.takt-presets .preset-btn.active small {
  color: #fff !important;
}


.takt-presets .preset-btn.active{
  background:#1976d2 !important;
  border-color:#1976d2 !important;
  color:#fff !important;
  box-shadow:0 0 0 2px rgba(25,118,210,.25) !important;
}
.takt-presets .preset-btn.active small{color:#fff !important}

.takt-presets {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 12px !important;
  width: 100% !important;
  margin: 16px 0 20px !important;
}
.takt-presets .preset-btn {
  display: block !important;
  visibility: visible !important;
  opacity: 1 !important;
  min-height: 82px !important;
  margin: 0 !important;
  padding: 12px !important;
  background: #292929 !important;
  color: #fff !important;
  border: 2px solid #777 !important;
  border-radius: 14px !important;
  font-size: 19px !important;
  font-weight: 700 !important;
  line-height: 1.25 !important;
  -webkit-appearance: none !important;
  appearance: none !important;
  touch-action: manipulation !important;
}
.takt-presets .preset-btn small {
  font-size: 14px !important;
  color: #bbb !important;
}
.takt-presets .preset-btn.active {
  background: #1976d2 !important;
  border-color: #1976d2 !important;
  color: #fff !important;
  box-shadow: 0 0 0 3px rgba(25,118,210,.35) !important;
}
.takt-presets .preset-btn.active small {
  color: #fff !important;
}

.production-end-highlight{background:rgba(37,99,235,.10);border:2px solid rgba(37,99,235,.30);border-radius:14px;padding:16px 14px;margin-top:8px}.production-end-highlight span{font-size:1.15em;font-weight:700}.production-end-highlight b{font-size:1.65em;font-weight:800;line-height:1.1}

/* iPhone / narrow-screen optimization */
.production-end-highlight{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  width:100%;
  box-sizing:border-box;
  overflow:hidden;
}
.production-end-highlight span{
  flex:0 0 auto;
  font-size:1.05em;
  font-weight:700;
}
.production-end-highlight b{
  flex:1 1 auto;
  min-width:0;
  text-align:right;
  font-size:clamp(1.15rem, 7vw, 1.65rem);
  font-weight:800;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}
@media (max-width:430px){
  .production-end-highlight{
    padding:14px 12px;
    gap:8px;
  }
  .production-end-highlight span{
    font-size:.98em;
  }
  .production-end-highlight b{
    font-size:clamp(1.05rem, 6.2vw, 1.4rem);
  }
}

  <button type="button" class="preset-btn" data-takt="140" onclick="setPreset(140,this)">U25<br><small>140 Sekunden</small></button>
  <button type="button" class="preset-btn" data-takt="200" onclick="setPreset(200,this)">U06<br><small>200 Sekunden</small></button>
</div>

<div class="card">
<div class="r"><span>Taktzeit</span><b id="taktanz">–</b></div>
<div class="r"><span>Noch zu fertigen</span><b id="rest">–</b></div>
<div class="r"><span>Benötigte Produktionszeit</span><b id="dauer">–</b></div>
<div class="r big production-end-highlight"><span>Produktionsende</span><b id="ende">–</b></div>
<div class="r"><span>Verbleibende Zeit</span><b id="count">–</b></div>
<div class="note" id="info">Start = Zeitpunkt der letzten Eingabe. Pause wird einmalig aufgerechnet.</div>
</div>

</main>
<script>
const $ = id => document.getElementById(id);
const p = n => ('0' + n).slice(-2);

let liveTimer = null;
let liveStart = Date.now();
let liveBaseRest = 0;
let liveTakt = 0;
let endTs = null;

function hms(s) {
  s = Math.max(0, Math.round(s));
  return p(Math.floor(s/3600)) + ':' + p(Math.floor(s%3600/60)) + ':' + p(s%60);
}

function calc(resetLive = true) {
  const soll = Number($('soll').value) || 0;
  const ist = Number($('ist').value) || 0;
  const takt = Number($('taktzeit').value) || 0;
  const pause = Number($('pause').value) || 0;

  const rest = Math.max(0, soll - ist);

  if (resetLive || liveTakt !== takt || liveBaseRest !== rest) {
    liveStart = Date.now();
    liveBaseRest = rest;
    liveTakt = takt;

    if (takt > 0) {
      // Fixed end time: this must NOT be recalculated on every timer tick.
      const totalSeconds = rest * takt + (rest > 0 ? pause * 60 : 0);
      endTs = liveStart + totalSeconds * 1000;
    } else {
      endTs = null;
    }
  }

  updateLive();
}

function updateLive() {
  const takt = Number($('taktzeit').value) || 0;

  if (!takt || endTs === null) {
    $('taktanz').textContent = '–';
    $('rest').textContent = '–';
    $('dauer').textContent = '–';
    $('ende').textContent = '–';
    $('count').textContent = '–';
    return;
  }

  const elapsed = Math.max(0, (Date.now() - liveStart) / 1000);
  const autoProduced = Math.floor(elapsed / takt);
  const currentRest = Math.max(0, liveBaseRest - autoProduced);

  // Real countdown to the fixed production end.
  const remainingSeconds = Math.max(0, (endTs - Date.now()) / 1000);

  $('taktanz').textContent = takt + ' s';
  $('rest').textContent = currentRest.toLocaleString('de-DE') + ' Stk.';
  $('dauer').textContent = hms(remainingSeconds);
  $('count').textContent = hms(remainingSeconds);

  const e = new Date(endTs);
  let t = p(e.getHours()) + ':' + p(e.getMinutes()) + ':' + p(e.getSeconds());

  const now = new Date();
  const days = Math.round(
    (new Date(e.getFullYear(), e.getMonth(), e.getDate()) -
     new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000
  );

  if (days > 0) t += ' (+' + days + ' T)';
  $('ende').textContent = currentRest > 0 ? t : '–';

  if (remainingSeconds <= 0) {
    $('count').textContent = '00:00:00';
    $('dauer').textContent = '00:00:00';
    $('rest').textContent = '0 Stk.';
    $('ende').textContent = '–';
    if (liveTimer) {
      clearInterval(liveTimer);
      liveTimer = null;
    }
  }
}

function setPreset(seconds, button) {
  document.querySelectorAll('.preset-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });

  button.classList.add('active');
  $('taktzeit').value = seconds;
  calc(true);
}

['soll', 'ist', 'taktzeit', 'pause'].forEach(function(id) {
  $(id).addEventListener('input', function() {
    if (id === 'taktzeit') {
      document.querySelectorAll('.preset-btn').forEach(function(btn) {
        btn.classList.toggle(
          'active',
          Number(btn.dataset.takt) === Number($('taktzeit').value)
        );
      });
    }

    calc(true);
  });
});

liveTimer = setInterval(function() {
  updateLive();
}, 250);

calc(true);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
